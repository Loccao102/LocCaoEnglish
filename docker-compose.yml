services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: loccao
      POSTGRES_PASSWORD: loccao
      POSTGRES_DB: loccao_english
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loccao -d loccao_english"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      LLM_CHAT_URL: ${LLM_CHAT_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    ports:
      - "8090:8090"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://loccao:loccao@postgres:5432/loccao_english?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      AI_SERVICE_URL: http://ai:8090
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
