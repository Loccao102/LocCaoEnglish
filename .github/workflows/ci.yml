name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:game
      - run: npm run assets:verify:3d
      - run: npm run assets:verify
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loccao
          POSTGRES_PASSWORD: loccao
          POSTGRES_DB: loccao_system_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U loccao -d loccao_system_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://loccao:loccao@127.0.0.1:5432/loccao_system_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go test -race ./...
      - run: go vet ./...

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m unittest discover -s tests -v
      - run: python -c "from app.server import app; print(app.title)"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config

  integration:
    runs-on: ubuntu-latest
    needs: [backend, ai-service, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start integration services
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d --build postgres redis ai api; then
              exit 0
            fi
            echo "Docker compose attempt ${attempt}/3 failed; cleaning up before retry."
            docker compose down -v --remove-orphans || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Wait for API
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Adaptive plan
        run: curl -fsS http://localhost:8080/v1/plan/today | grep -q 'items'
      - name: Goal-aware questline
        run: curl -fsS http://localhost:8080/v1/player/questline | grep -q 'items'
      - name: Player progression
        run: curl -fsS http://localhost:8080/v1/player/progression | grep -q 'worlds'
      - name: Packed campaign routes
        run: |
          curl -fsS http://localhost:8080/v1/player/progression > /tmp/progression.json
          grep -q 'travel-airport' /tmp/progression.json
          grep -q 'conversation-cafe' /tmp/progression.json
          grep -q 'work-standup' /tmp/progression.json
      - name: Player profile
        run: curl -fsS http://localhost:8080/v1/player/profile | grep -q 'dailyMinutes'
      - name: Lesson catalog
        run: curl -fsS http://localhost:8080/v1/lessons | grep -q 'airport-check-in-sprint'
      - name: Social leaderboard
        run: curl -fsS http://localhost:8080/v1/social/leaderboard | grep -q 'items'
      - name: Writing saved revision and unavailable-provider recovery
        run: node scripts/verify-writing-api.mjs
      - name: Saved acoustic feedback and unavailable-provider recovery
        run: node scripts/verify-acoustic-api.mjs
      - name: Checked practice receipts and retired client scores
        run: node scripts/verify-reward-boundary.mjs
      - name: Stable daily practice and dated reward recovery
        run: node scripts/verify-daily-practice.mjs
      - name: Nine campaign preparation gates and one-time chapter receipts
        run: node scripts/verify-campaign-gates.mjs
      - name: Vocabulary unlock receipts and signed-in equipment
        run: node scripts/verify-vocabulary-unlocks.mjs
      - name: Account-owned profile settings and fixed daily snapshot
        run: node scripts/verify-profile-owner.mjs
      - name: Neural TTS fallback route
        run: |
          curl -fsS -X POST http://localhost:8080/v1/ai/tts \
            -H 'Content-Type: application/json' \
            -d '{"text":"The flight now departs from gate twelve.","locale":"en-US","voice":"en-US-JennyNeural","rate":1}' | grep -q 'provider'
      - name: Pronunciation route
        run: |
          python - <<'PY' > /tmp/pronunciation.json
          import base64, io, json, struct, wave
          frames=b''.join(struct.pack('<h',3000 if i%20<10 else -3000) for i in range(16000));buf=io.BytesIO()
          with wave.open(buf,'wb') as out: out.setnchannels(1);out.setsampwidth(2);out.setframerate(16000);out.writeframes(frames)
          print(json.dumps({'audioBase64':base64.b64encode(buf.getvalue()).decode(),'referenceText':'hello world','transcript':'hello world','locale':'en-US'}))
          PY
          curl -fsS -X POST http://localhost:8080/v1/ai/pronunciation-score \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pronunciation.json | grep -q 'acousticAssessment'
      - run: docker compose ps
      - if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and start application stack
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d --build; then
              exit 0
            fi
            echo "Docker compose attempt ${attempt}/3 failed; cleaning up before retry."
            docker compose down -v --remove-orphans || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Wait for web
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs web api
          exit 1
      - name: Verify patched image library in the standalone container
        run: |
          docker compose exec -T web node <<'NODE'
          const assert = require('node:assert/strict');
          const sharp = require('sharp');
          assert.equal(sharp.versions.sharp, '0.35.5');
          assert.equal(sharp.versions.rsvg, '2.63.2');
          sharp({ create: { width: 4, height: 4, channels: 3, background: '#82cbbb' } })
            .resize(2, 2).png().toBuffer({ resolveWithObject: true })
            .then(({ data, info }) => {
              assert.equal(info.format, 'png');
              assert.equal(info.width, 2);
              assert.equal(info.height, 2);
              assert.equal(data.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
              console.log('Standalone sharp 0.35.5 / librsvg 2.63.2 transform passed.');
            })
            .catch(error => { console.error(error); process.exit(1); });
          NODE
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-mobile-review
          path: .cache/profile-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose down -v
